[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; === EXTENSION 100: MOBILE PHONE (Zoiper) ===
[100]
type=endpoint
context=intercom
disallow=all
allow=ulaw
auth=100
aors=100

[100]
type=auth
auth_type=userpass
password=1234
username=100

[100]
type=aor
max_contacts=1

