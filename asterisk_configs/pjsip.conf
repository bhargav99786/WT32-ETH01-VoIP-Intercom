; === EXTENSION 200: ESP32 (Static IP) ===
; No authentication required because the IP is static
[200]
type=endpoint
context=intercom
disallow=all
allow=ulaw
aors=200

[200]
type=aor
; IMPORTANT: Replace REPLACE_WITH_ESP32_IP with the actual IP address
contact=sip:200@REPLACE_WITH_ESP32_IP:5060
